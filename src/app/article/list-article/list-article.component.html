<nav class="navbar navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand">Liste Articles</a>
    <form class="d-flex">
      <button
        class="btn btn-outline-success"
        type="submit"
        (click)="addArticle()"
      >
        <i class="fa fa-plus"></i></button
      >&nbsp; &nbsp;

      <a routerLink="/categories" class="btn btn-outline-danger" type="button"
        >Log Out</a
      >
    </form>
  </div>
</nav>

<div class="row">
  <div
    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3"
  >
    <h1 class="h2">Liste Articles</h1>
  </div>
  <div class="pricing-header mx-auto">
    <div class="table-responsive">
      <table class="table table-bordered table-responsive-sm table-responsive-md table-responsive-lg">
        <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Code</th>
            <th scope="col">Libelle</th>
            <th scope="col">Prix Achat</th>
            <th scope="col">Prix Vente</th>
            <th scope="col">TVA</th>
            <th scope="col">FODEC</th>
            <th scope="col">Stock Initial</th>
            <th scope="col">Stock</th>
            <th scope="col" class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of listData | async">
            <th scope="row">{{item.id}}</th>
            <td>{{item.code}}</td>
            <td>{{item.libelle}}</td>
            <td>{{item.pa}}</td>
            <td>{{item.pv}}</td>
            <td>{{item.tva}}</td>
            <td>{{item.fodec}}</td>
            <td>{{item.stockInit}}</td>
            <td>{{item.stock}}</td>
            <td>
                <button class="btn btn-warning" style="margin-left: 20px;" (click)="selectData(item)">
                    <i class="fa fa-pencil-square-o"></i>
                </button>
                <button class="btn btn-danger"  (click)="removeData(item.id!)">
                    <i class="fa fa-trash-o"></i>
                </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
